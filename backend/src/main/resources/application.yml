spring:
  application:
    name: smart-campus-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_campus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email

server:
  port: ${SERVER_PORT:8080}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  security:
    role-mapping:
      admin-emails: ${ROLE_ADMIN_EMAILS:}
      manager-emails: ${ROLE_MANAGER_EMAILS:}
      technician-emails: ${ROLE_TECHNICIAN_EMAILS:}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
